<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fuel Route Planner</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root { --panel: 380px; --accent: #0f766e; --muted: #6b7280; --border: #e5e7eb; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #111827; }
    #layout { display: flex; height: 100vh; }
    #panel { width: var(--panel); overflow-y: auto; padding: 20px; border-right: 1px solid var(--border); background: #fff; }
    #map { flex: 1; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    h2 { font-size: 15px; margin: 0 0 6px; }
    form { display: grid; gap: 10px; margin-bottom: 20px; }
    .field { position: relative; }
    label { font-size: 12px; color: var(--muted); }
    input { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button { padding: 10px; background: var(--accent); color: #fff; border: 0; border-radius: 6px; font-size: 14px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .suggestions { position: absolute; left: 0; right: 0; z-index: 10; margin: 4px 0 0; padding: 4px 0; list-style: none;
      background: #fff; border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 8px 24px rgba(0, 0, 0, .12);
      max-height: 240px; overflow-y: auto; }
    .suggestions li { padding: 8px 10px; font-size: 14px; cursor: pointer; }
    .suggestions li:hover, .suggestions li.active { background: #f3f4f6; }
    .suggestions li small { color: var(--muted); margin-left: 6px; }
    .resolved { font-size: 13px; color: var(--muted); margin-bottom: 14px; line-height: 1.5; }
    .resolved b { color: #111827; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .stat { padding: 10px; border: 1px solid var(--border); border-radius: 6px; }
    .stat span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .stat strong { font-size: 18px; }
    .stop { padding: 10px 0; border-top: 1px solid var(--border); font-size: 13px; }
    .stop b { display: block; }
    .stop small { color: var(--muted); }
    .error { padding: 10px; background: #fef2f2; color: #991b1b; border-radius: 6px; font-size: 13px; }
    .meta { font-size: 12px; color: var(--muted); margin-top: 12px; }
    .hidden { display: none; }
    @media (max-width: 800px) {
      #layout { flex-direction: column; height: auto; }
      #panel { width: auto; overflow: visible; border-right: 0; border-bottom: 1px solid var(--border); }
      #map { flex: none; height: 65vh; }
    }
  </style>
</head>
<body>
<div id="layout">
  <aside id="panel">
    <h1>Fuel Route Planner</h1>
    <form id="form" autocomplete="off">
      <div class="field">
        <label for="start">Start</label>
        <input id="start" name="start" placeholder="City, ST or lat,lon" required>
      </div>
      <div class="field">
        <label for="finish">Finish</label>
        <input id="finish" name="finish" placeholder="City, ST or lat,lon" required>
      </div>
      <button id="submit" type="submit">Plan route</button>
    </form>
    <div id="error" class="error hidden"></div>
    <div id="results" class="hidden">
      <div class="resolved">
        <b>From</b> <span id="from-label"></span><br>
        <b>To</b> <span id="to-label"></span>
      </div>
      <div class="stats">
        <div class="stat"><span>Distance</span><strong id="distance"></strong></div>
        <div class="stat"><span>Drive time</span><strong id="duration"></strong></div>
        <div class="stat"><span>Fuel cost</span><strong id="cost"></strong></div>
        <div class="stat"><span>Fuel bought</span><strong id="gallons"></strong></div>
      </div>
      <h2>Fuel stops</h2>
      <div id="stops"></div>
      <div id="meta" class="meta"></div>
    </div>
  </aside>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const ROUTE_URL = "{% url 'route-plan' %}";
  const PLACES_URL = "{% url 'place-search' %}";
  const $ = (id) => document.getElementById(id);

  const map = L.map("map").setView([39.5, -98.35], 4);
  L.tileLayer("{{ tile_url|escapejs }}", {
    maxZoom: 19,
    subdomains: "abcd",
    attribution: "{{ tile_attribution|escapejs }}"
  }).addTo(map);
  const layer = L.layerGroup().addTo(map);

  function decodePolyline(encoded, precision = 5) {
    const factor = Math.pow(10, precision);
    const points = [];
    let index = 0, lat = 0, lng = 0;
    const read = () => {
      let result = 0, shift = 0, byte;
      do {
        byte = encoded.charCodeAt(index++) - 63;
        result |= (byte & 0x1f) << shift;
        shift += 5;
      } while (byte >= 0x20);
      return result & 1 ? ~(result >> 1) : result >> 1;
    };
    while (index < encoded.length) {
      lat += read();
      lng += read();
      points.push([lat / factor, lng / factor]);
    }
    return points;
  }

  function attachSuggestions(input) {
    const list = document.createElement("ul");
    list.className = "suggestions hidden";
    input.parentNode.appendChild(list);
    let timer, requestId = 0, active = -1, items = [];

    const close = () => { items = []; active = -1; list.innerHTML = ""; list.classList.add("hidden"); };
    const choose = (item) => { input.value = item.label; close(); };
    const render = () => {
      list.innerHTML = "";
      items.forEach((item, i) => {
        const li = document.createElement("li");
        li.innerHTML = `${item.city}<small>${item.state}</small>`;
        if (i === active) li.classList.add("active");
        li.addEventListener("mousedown", (event) => { event.preventDefault(); choose(item); });
        list.appendChild(li);
      });
      list.classList.toggle("hidden", items.length === 0);
    };

    input.addEventListener("input", () => {
      clearTimeout(timer);
      const q = input.value.trim();
      if (q.length < 2 || /^-?\d/.test(q)) return close();
      timer = setTimeout(async () => {
        const id = ++requestId;
        try {
          const response = await fetch(`${PLACES_URL}?${new URLSearchParams({ q })}`, { headers: { Accept: "application/json" } });
          const found = response.ok ? await response.json() : [];
          if (id !== requestId) return;
          items = found;
          active = -1;
          render();
        } catch (error) {
          close();
        }
      }, 150);
    });
    input.addEventListener("keydown", (event) => {
      if (!items.length) return;
      if (event.key === "ArrowDown") { active = (active + 1) % items.length; render(); event.preventDefault(); }
      else if (event.key === "ArrowUp") { active = (active - 1 + items.length) % items.length; render(); event.preventDefault(); }
      else if (event.key === "Enter" && active >= 0) { choose(items[active]); event.preventDefault(); }
      else if (event.key === "Escape") close();
    });
    input.addEventListener("blur", close);
  }

  const marker = (point, color) => L.circleMarker(point, {
    radius: 8, color: "#fff", weight: 2, fillColor: color, fillOpacity: 1
  });

  function render(plan) {
    layer.clearLayers();
    const line = L.polyline(decodePolyline(plan.route.geometry), { color: "#2563eb", weight: 4 }).addTo(layer);
    marker([plan.start.latitude, plan.start.longitude], "#16a34a").bindPopup(`<b>Start</b><br>${plan.start.label}`).addTo(layer);
    marker([plan.finish.latitude, plan.finish.longitude], "#dc2626").bindPopup(`<b>Finish</b><br>${plan.finish.label}`).addTo(layer);

    $("stops").innerHTML = "";
    for (const stop of plan.fuel_stops) {
      const s = stop.station;
      marker([stop.location.latitude, stop.location.longitude], "#f59e0b")
        .bindPopup(`<b>Stop ${stop.stop_number}: ${s.name}</b><br>${s.address}, ${s.city}, ${s.state}<br>` +
                   `$${stop.price_per_gallon.toFixed(3)}/gal &middot; ${stop.gallons} gal &middot; $${stop.cost.toFixed(2)}`)
        .addTo(layer);
      const div = document.createElement("div");
      div.className = "stop";
      div.innerHTML = `<b>${stop.stop_number}. ${s.name}</b>${s.city}, ${s.state} &middot; mile ${stop.distance_from_start_miles}<br>` +
                      `<small>${stop.gallons} gal at $${stop.price_per_gallon.toFixed(3)} = $${stop.cost.toFixed(2)}</small>`;
      $("stops").appendChild(div);
    }
    if (!plan.fuel_stops.length) {
      $("stops").innerHTML = `<div class="stop">No refuelling needed: ${plan.distance_miles} miles is within the ${plan.vehicle.range_miles}-mile range of a full tank.</div>`;
    }

    $("from-label").textContent = plan.start.label;
    $("to-label").textContent = plan.finish.label;
    $("distance").textContent = `${plan.distance_miles.toLocaleString()} mi`;
    $("duration").textContent = `${plan.duration_hours} h`;
    $("cost").textContent = `$${plan.total_fuel_cost.toFixed(2)}`;
    $("gallons").textContent = `${plan.total_fuel_gallons} gal`;
    $("meta").textContent = `${plan.stations_considered} stations along the route · ` +
      `${plan.meta.external_api_calls} external API call(s) · ${plan.meta.processing_ms} ms`;
    $("results").classList.remove("hidden");
    map.fitBounds(line.getBounds(), { padding: [30, 30] });
  }

  async function plan(start, finish) {
    $("submit").disabled = true;
    $("error").classList.add("hidden");
    try {
      const response = await fetch(`${ROUTE_URL}?${new URLSearchParams({ start, finish })}`, { headers: { Accept: "application/json" } });
      const body = await response.json();
      if (!response.ok) throw new Error(body.error ? body.error.message : response.statusText);
      render(body);
    } catch (error) {
      $("results").classList.add("hidden");
      $("error").textContent = error.message;
      $("error").classList.remove("hidden");
    } finally {
      $("submit").disabled = false;
    }
  }

  attachSuggestions($("start"));
  attachSuggestions($("finish"));

  $("form").addEventListener("submit", (event) => {
    event.preventDefault();
    const start = $("start").value.trim();
    const finish = $("finish").value.trim();
    history.replaceState(null, "", `?${new URLSearchParams({ start, finish })}`);
    plan(start, finish);
  });

  const params = new URLSearchParams(location.search);
  if (params.get("start") && params.get("finish")) {
    $("start").value = params.get("start");
    $("finish").value = params.get("finish");
    plan(params.get("start"), params.get("finish"));
  }
</script>
</body>
</html>
